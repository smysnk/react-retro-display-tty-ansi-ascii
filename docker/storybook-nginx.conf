server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location = /projects/react-retro-screen/storybook {
    return 308 /projects/react-retro-screen/storybook/;
  }

  location = /projects/react-retro-screen/storybook/build-metadata.json {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  location ~ ^/projects/react-retro-screen/storybook/badges/.*\.json$ {
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  location = /projects/react-retro-screen/storybook/iframe.html {
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    try_files $uri =404;
  }

  location ^~ /projects/react-retro-screen/storybook/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ^~ /projects/react-retro-screen/storybook/ansi-gallery/ {
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  location /projects/react-retro-screen/storybook/ {
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    try_files $uri/index.html $uri =404;
  }

  location / {
    return 404;
  }
}
