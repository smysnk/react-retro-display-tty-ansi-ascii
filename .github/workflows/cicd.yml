name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      publish_npm:
        description: "Publish the npm package after validation"
        required: false
        default: true
        type: boolean

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  ci:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate project Yarn
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$package_manager" --activate

      - name: Check Yarn version
        run: yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install native Ansilove build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libgd-dev

      - name: Detect browser executable
        id: browser
        shell: bash
        run: |
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser
          do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No Chrome or Chromium executable found on the runner." >&2
          exit 1

      - name: Run unified validation suite
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: yarn test:ci

      - name: Run pinned Ansilove oracle contracts and focused parity
        run: yarn test:ansilove:native && yarn test:ansilove:focused-parity

      - name: Capture test-station start time
        run: echo "TEST_STATION_BUILD_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Run test-station report
        id: test_station
        shell: bash
        run: |
          set +e
          yarn test:coverage
          exit_code=$?
          if [ "$exit_code" -eq 0 ]; then
            status=passed
          else
            status=failed
          fi
          echo "TEST_STATION_CI_STATUS=$status" >> "$GITHUB_ENV"
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish test-station summary
        if: always() && hashFiles('.test-results/test-station/report.json') != ''
        run: |
          node --input-type=module <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync(".test-results/test-station/report.json", "utf8"));
          const summary = report.summary || {};
          const coveragePct = summary.coverage?.lines?.pct;
          console.log("### Test Station Summary");
          console.log("");
          console.log(`- Packages: ${summary.totalPackages ?? 0}`);
          console.log(`- Suites: ${summary.totalSuites ?? 0}`);
          console.log(`- Tests: ${summary.totalTests ?? 0}`);
          console.log(`- Failed tests: ${summary.failedTests ?? 0}`);
          console.log(`- Failed packages: ${summary.failedPackages ?? 0}`);
          console.log(`- Line coverage: ${Number.isFinite(coveragePct) ? `${coveragePct}%` : "n/a"}`);
          EOF

      - name: Publish test-station ingest
        if: always() && hashFiles('.test-results/test-station/report.json') != ''
        continue-on-error: true
        env:
          TEST_STATION_INGEST_ENDPOINT: https://test-station.smysnk.com/api/ingest
          TEST_STATION_INGEST_PROJECT_KEY: react-retro-display-tty-ansi-ascii
          TEST_STATION_INGEST_SHARED_KEY: ${{ secrets.TEST_STATION_INGEST_SHARED_KEY }}
        run: |
          if [ -z "$TEST_STATION_INGEST_SHARED_KEY" ]; then
            echo "Skipping test-station ingest: TEST_STATION_INGEST_SHARED_KEY is not configured."
            exit 0
          fi
          completed_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          export TEST_STATION_BUILD_COMPLETED_AT="$completed_at"
          echo "TEST_STATION_BUILD_COMPLETED_AT=$completed_at" >> "$GITHUB_ENV"
          node ./scripts/test-station/publish-ingest-report.mjs

      - name: Upload test artifacts
        if: always() && hashFiles('.test-results/test-station/report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: test-station-results
          path: .test-results/test-station
          retention-days: 14

      - name: Fail if report detected regressions
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.test_station.outputs.exit_code }}"
          if [ -z "$exit_code" ]; then
            echo "No test-station exit code was reported; defaulting to success."
            exit 0
          fi
          if [ "$exit_code" -ne 0 ] && [ -f ".test-results/test-station/report.json" ]; then
            node ./scripts/test-station/print-regression-summary.mjs .test-results/test-station/report.json
          fi
          exit "$exit_code"

      - name: Build Storybook for smysnk.com
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          STORYBOOK_SOURCE_REVISION: ${{ github.sha }}
        run: yarn storybook:publish:build

      - name: Build test-station badge payloads
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          npx --yes @test-station/cli@0.2.40 pages --input ./.test-results/test-station/report.json --output ./.tmp-test-station-pages
          mkdir -p storybook-static/badges
          cp -R ./.tmp-test-station-pages/badges/. storybook-static/badges/

      - name: Validate mounted Storybook publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: yarn storybook:publish:check

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable Storybook image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_STORYBOOK }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            --build-arg SOURCE_REVISION="$IMAGE_TAG" \
            -f docker/Dockerfile.storybook \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
            .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

      - name: Smoke test Storybook image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY_STORYBOOK }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          image="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          container_id="$(docker run --detach --publish 8080:8080 "$image")"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          base_url=http://127.0.0.1:8080/projects/react-retro-screen/storybook
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "$base_url/build-metadata.json" > /tmp/storybook-metadata.json; then
              break
            fi
            sleep 1
          done
          jq --exit-status --arg revision "$IMAGE_TAG" \
            '.project == "react-retro-screen" and .surface == "storybook" and .revision == $revision' \
            /tmp/storybook-metadata.json
          curl --fail --silent --show-error "$base_url/" >/dev/null
          curl --fail --silent --show-error "$base_url/iframe.html?id=retroscreen--midjourney-vortex" >/dev/null
          curl --fail --silent --show-error "$base_url/index.json" \
            | jq --exit-status '.entries["retroscreen-display-buffer--bad-apple-ansi"]'
          curl --fail --silent --show-error "$base_url/ansi-gallery/manifest.json" >/dev/null
          curl --fail --silent --show-error "$base_url/badges/tests.json" \
            | jq --exit-status '.schemaVersion == 1'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url")" = "308"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base_url/not-a-page")" = "404"

      - name: Request personal-website promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.PERSONAL_WEBSITE_DISPATCH_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_REPOSITORY: ${{ vars.ECR_REPOSITORY_STORYBOOK }}
        run: |
          payload="$(jq --null-input \
            --arg slug "react-retro-screen" \
            --arg surface "storybook" \
            --arg tag "$IMAGE_TAG" \
            --arg repository "$IMAGE_REPOSITORY" \
            '{event_type:"project-site-published",client_payload:{slug:$slug,surface:$surface,image_tag:$tag,image_repository:$repository}}')"
          gh api --method POST repos/smysnk/personal-website/dispatches --input - <<<"$payload"

      - name: Set npm package version from build number
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION_MAJOR: ${{ vars.NPM_VERSION_MAJOR || '0' }}
          VERSION_MINOR: ${{ vars.NPM_VERSION_MINOR || '1' }}
          PATCH_MODE: ${{ vars.NPM_VERSION_PATCH_MODE || 'build' }}
          PATCH_FIXED: ${{ vars.NPM_VERSION_PATCH_FIXED }}
        run: bash ./scripts/release/set-version-from-build.sh

      - name: Validate npm release package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: bash ./scripts/release/release-npm-package.sh

      - name: Check whether this version is already published
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: package_version
        shell: bash
        run: |
          package_name="$(node -e "process.stdout.write(require('./package.json').name)")"
          package_version="$(node -e "process.stdout.write(require('./package.json').version)")"

          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"

          if npm view "$package_name@$package_version" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Package $package_name@$package_version is already on npm. Skipping publish." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Package $package_name@$package_version is not on npm yet. Publishing after checks pass." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build package for npm publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package_version.outputs.should_publish == 'true'
        run: yarn build

      - name: Publish npm package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.package_version.outputs.should_publish == 'true' && (github.event_name == 'push' || inputs.publish_npm)
        env:
          NPM_PUBLISH: "1"
        run: bash ./scripts/release/release-npm-package.sh

      - name: Build GitHub release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > .github-release-notes.md <<EOF
          Release for \`${{ steps.package_version.outputs.package_name }}@${{ steps.package_version.outputs.package_version }}\`

          - Commit: \`${{ github.sha }}\`
          - npm: https://www.npmjs.com/package/${{ steps.package_version.outputs.package_name }}/v/${{ steps.package_version.outputs.package_version }}
          - Storybook: https://smysnk.com/projects/react-retro-screen/storybook/
          EOF

      - name: Create or update GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.package_version.outputs.package_version }}
          RELEASE_TITLE: react-retro-display-tty-ansi-ascii v${{ steps.package_version.outputs.package_version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --notes-file .github-release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --target "${GITHUB_SHA}" \
              --title "$RELEASE_TITLE" \
              --notes-file .github-release-notes.md
          fi

  ansi_parity_scheduled:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install npm
        run: npm install --global "npm@^11.5.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Activate project Yarn
        run: |
          package_manager="$(node -p "require('./package.json').packageManager")"
          corepack prepare "$package_manager" --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Detect browser executable
        id: browser
        shell: bash
        run: |
          for candidate in \
            /usr/bin/google-chrome \
            /usr/bin/google-chrome-stable \
            /usr/bin/chromium \
            /usr/bin/chromium-browser
          do
            if [ -x "$candidate" ]; then
              echo "path=$candidate" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No Chrome or Chromium executable found on the runner." >&2
          exit 1

      - name: Run scheduled ANSI gallery parity suite
        run: yarn test:ansi:gallery:scheduled

      - name: Run scheduled browser ANSI gallery parity suite
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
          ANSI_GALLERY_BROWSER_IDS: 101-ag-cansi-ag-ve-ans
          ANSI_GALLERY_BROWSER_SAMPLE_EVERY: 65536
        run: yarn test:e2e:ansi-gallery:scheduled

      - name: Run nightly full browser ANSI parity suite
        env:
          CHROME_PATH: ${{ steps.browser.outputs.path }}
        run: yarn test:e2e:ansi-byte-parity:nightly
